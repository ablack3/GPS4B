name: Vendor Ferrostar

# Rebuilds the vendored Ferrostar React Native binding and opens a PR with the
# result.
#
# Ferrostar does not publish its React Native packages to npm and gitignores
# every generated artifact, so the binding has to be compiled from Rust. GPS4B
# vendors the output (mobile/vendor/ferrostar) rather than building it on every
# EAS run: EAS builds stay fast and need no Rust toolchain, at the cost of
# committed binaries that this workflow refreshes.
#
# Android and iOS artifacts come from different runners and are merged into one
# branch. Run this when bumping FERROSTAR_VERSION, not on a schedule — a
# routing binding should move deliberately.

on:
  workflow_dispatch:
    inputs:
      ferrostar_ref:
        description: 'Ferrostar git tag to vendor (default: mobile/vendor/ferrostar/FERROSTAR_VERSION)'
        required: false

concurrency:
  group: ferrostar-vendor
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
      - name: Build and vendor the Android binding
        run: ./build-ferrostar.sh android "${{ inputs.ferrostar_ref }}"
        working-directory: mobile/vendor
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
      - uses: actions/upload-artifact@v4
        with:
          name: ferrostar-android
          path: mobile/vendor/ferrostar/
          include-hidden-files: true

  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and vendor the iOS binding
        run: ./build-ferrostar.sh ios "${{ inputs.ferrostar_ref }}"
        working-directory: mobile/vendor
      - uses: actions/upload-artifact@v4
        with:
          name: ferrostar-ios
          # Only the iOS-specific half; the shared generated sources come from
          # the Android job, which produces identical output for them.
          path: |
            mobile/vendor/ferrostar/uniffi/ios/
            mobile/vendor/ferrostar/uniffi/FerrostarRN.xcframework/
          include-hidden-files: true

  open-pr:
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Replace the vendored tree
        run: rm -rf mobile/vendor/ferrostar/core mobile/vendor/ferrostar/maplibreui mobile/vendor/ferrostar/uniffi

      - uses: actions/download-artifact@v4
        with:
          name: ferrostar-android
          path: mobile/vendor/ferrostar/

      - uses: actions/download-artifact@v4
        with:
          name: ferrostar-ios
          path: mobile/vendor/ferrostar/uniffi/

      - name: Confirm both platforms landed
        run: |
          test -f mobile/vendor/ferrostar/uniffi/android/src/main/jniLibs/arm64-v8a/libferrostar.so \
            || { echo "Android binary missing"; exit 1; }
          test -f mobile/vendor/ferrostar/uniffi/FerrostarRN.xcframework/Info.plist \
            || { echo "iOS xcframework missing"; exit 1; }
          du -sh mobile/vendor/ferrostar/*

      - name: Open a PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ferrostar-vendor
          title: "Vendor Ferrostar ${{ inputs.ferrostar_ref || 'pinned version' }}"
          commit-message: "Vendor Ferrostar native binding\n\nRegenerated by .github/workflows/ferrostar-vendor.yml."
          body: |
            Regenerated `mobile/vendor/ferrostar` from upstream source.

            Binaries are compiled output, not reviewable line by line. What to check:

            - `mobile/vendor/ferrostar/FERROSTAR_VERSION` is the tag intended.
            - Both platform artifacts are present (the workflow fails otherwise).
            - A development EAS build on a real iOS and a real Android device logs
              `Ferrostar native binding loaded` at startup (`src/ferrostar-native.ts`).
          add-paths: mobile/vendor/ferrostar
